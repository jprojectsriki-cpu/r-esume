<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>管理画面 | R-ESUME</title>
    <link rel="icon" href="img/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=Dela+Gothic+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/loading.css?v=20261115c">
    <link rel="stylesheet" href="css/lp.css?v=20261115c">
    <link rel="stylesheet" href="css/game.css?v=20261116b">
    <link rel="stylesheet" href="css/admin.css?v=20261116d">
    <script>document.documentElement.classList.add('js');</script>
</head>
<body class="admin">
<script src="js/loading.js?v=20261115c"></script>

<header class="site-header">
    <div class="header-inner">
        <a class="brand" href="dashboard.html" aria-label="ホームへ"><span class="brand-mark"><img src="img/logo.png" alt="" width="24" height="28"></span><span class="brand-name">R-ESUME</span></a>
        <span class="admin-tag">管理画面</span>
        <div class="header-actions" style="margin-left:auto">
            <button type="button" class="btn btn-secondary" id="reloadBtn">更新</button>
            <button type="button" class="btn btn-secondary" id="logoutBtn">ログアウト</button>
        </div>
    </div>
</header>

<main class="admin-main">
    <div class="admin-wrap">
        <div class="stats" id="stats" role="group" aria-label="いまの状況"></div>
        <div class="search">
            <label class="sr" for="adminSearch">さがす</label>
            <input type="search" id="adminSearch" placeholder="名前・メール・申込番号・資格で さがす" autocomplete="off" maxlength="60">
        </div>
        <div class="admin-tabs" role="tablist" aria-label="表示の切り替え">
            <button type="button" role="tab" class="tab is-on" id="tabApps" aria-selected="true" data-tab="apps">申込 <span class="count" id="cntApps"></span></button>
            <button type="button" role="tab" class="tab" id="tabUsers" aria-selected="false" data-tab="users">受講生 <span class="count" id="cntUsers"></span></button>
            <button type="button" role="tab" class="tab" id="tabQuals" aria-selected="false" data-tab="quals">資格 <span class="count" id="cntQuals"></span></button>
        </div>

        <p class="toast" id="toast" role="status" aria-live="polite"></p>

        <section id="paneApps">
            <div class="chips" id="appChips" role="group" aria-label="申込のしぼりこみ"></div>
            <div class="cards" id="appList"></div>
            <p class="empty" id="appEmpty" hidden>該当する申込は、ありません。</p>
        </section>

        <section id="paneUsers" hidden>
            <div class="chips" id="userChips" role="group" aria-label="受講生のしぼりこみ"></div>
            <div class="cards" id="userList"></div>
            <p class="empty" id="userEmpty" hidden>該当する受講生は、いません。</p>
        </section>

        <section id="paneQuals" hidden>
            <p class="q-lead">会話で、受講生が✔して選ぶ資格の一覧です。「ラベル」ごとにまとまって表示されます。同じラベルの中で複数に✔されたときは、「順位」が大きいほうだけが有効になります（N4とN2なら、N2だけ）。</p>
            <button type="button" class="btn" id="qAdd">＋ 資格を追加</button>
            <div class="cards" id="qualList" style="margin-top:14px"></div>
            <p class="empty" id="qualEmpty" hidden>資格は、まだ登録されていません。</p>
        </section>

        <p class="form-msg is-error" id="loadError" hidden></p>
    </div>
</main>

<dialog id="dlgConfirm" class="confirm">
    <form method="dialog" id="confirmForm">
        <h2 id="cfTitle"></h2>
        <p id="cfBody"></p>
        <div class="field" id="cfReasonRow" hidden>
            <label for="cfReason">理由（メモ・任意）</label>
            <input type="text" id="cfReason" maxlength="100">
        </div>
        <div class="confirm-actions">
            <button type="button" class="btn btn-secondary" id="cfNo">戻る</button>
            <button type="submit" class="btn" id="cfYes">実行する</button>
        </div>
    </form>
</dialog>

<dialog id="dlgQual" class="confirm">
    <form method="dialog" id="qualForm" novalidate>
        <h2 id="qTitle">資格を追加</h2>
        <div class="field">
            <label for="qLabel">ラベル（選ぶときの見出し）</label>
            <input type="text" id="qLabel" maxlength="30" list="qLabels" placeholder="例：ワープロ、Excel、簿記、運転免許" autocomplete="off">
            <datalist id="qLabels"></datalist>
        </div>
        <div class="field">
            <label for="qName">履歴書に載る名前</label>
            <input type="text" id="qName" maxlength="30" placeholder="例：日本語能力試験 N2 合格" autocomplete="off">
        </div>
        <div class="field">
            <label for="qRank">順位（任意・1〜99）</label>
            <input type="text" id="qRank" inputmode="numeric" maxlength="2" placeholder="例：N2なら4。N1なら5" autocomplete="off">
            <p class="hint">同じラベルの中で、数字が大きいほど上です。空にすると、ほかの資格と競合しません。</p>
        </div>
        <p class="form-msg is-error" id="qMsg" role="alert"></p>
        <div class="confirm-actions">
            <button type="button" class="btn btn-secondary" id="qNo">戻る</button>
            <button type="submit" class="btn" id="qYes">保存する</button>
        </div>
    </form>
</dialog>

<script src="js/config.js?v=20261115c"></script>
<script src="js/common.js?v=20261115c"></script>
<script src="js/admin.js?v=20261116c"></script>
</body>
</html>
