<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>管理画面 | R-ESUME</title>
    <link rel="icon" href="img/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/loading.css?v=20261115c">
    <link rel="stylesheet" href="css/lp.css?v=20261115c">
    <link rel="stylesheet" href="css/admin.css?v=20261115c">
    <script>document.documentElement.classList.add('js');</script>
</head>
<body class="admin">
<script src="js/loading.js?v=20261115c"></script>

<header class="site-header">
    <div class="header-inner">
        <a class="brand" href="mypage.html" aria-label="マイページへ"><span class="brand-mark"><img src="img/logo.png" alt="" width="24" height="28"></span><span class="brand-name">R-ESUME</span></a>
        <span class="admin-tag">管理画面</span>
        <div class="header-actions" style="margin-left:auto">
            <button type="button" class="btn btn-secondary" id="reloadBtn">更新</button>
            <button type="button" class="btn btn-secondary" id="logoutBtn">ログアウト</button>
        </div>
    </div>
</header>

<main class="admin-main">
    <div class="admin-wrap">
        <div class="admin-tabs" role="tablist" aria-label="表示の切り替え">
            <button type="button" role="tab" class="tab is-on" id="tabApps" aria-selected="true" data-tab="apps">申込 <span class="count" id="cntApps"></span></button>
            <button type="button" role="tab" class="tab" id="tabUsers" aria-selected="false" data-tab="users">受講生 <span class="count" id="cntUsers"></span></button>
        </div>

        <p class="toast" id="toast" role="status" aria-live="polite"></p>

        <section id="paneApps">
            <div class="chips" id="appChips" role="group" aria-label="申込のしぼりこみ"></div>
            <div class="cards" id="appList"></div>
            <p class="empty" id="appEmpty" hidden>該当する申込は、ありません。</p>
        </section>

        <section id="paneUsers" hidden>
            <div class="chips" id="userChips" role="group" aria-label="受講生のしぼりこみ"></div>
            <div class="cards" id="userList"></div>
            <p class="empty" id="userEmpty" hidden>該当する受講生は、いません。</p>
        </section>

        <p class="form-msg is-error" id="loadError" hidden></p>
    </div>
</main>

<dialog id="dlgConfirm" class="confirm">
    <form method="dialog" id="confirmForm">
        <h2 id="cfTitle"></h2>
        <p id="cfBody"></p>
        <div class="field" id="cfReasonRow" hidden>
            <label for="cfReason">理由（メモ・任意）</label>
            <input type="text" id="cfReason" maxlength="100">
        </div>
        <div class="confirm-actions">
            <button type="button" class="btn btn-secondary" id="cfNo">戻る</button>
            <button type="submit" class="btn" id="cfYes">実行する</button>
        </div>
    </form>
</dialog>

<script src="js/config.js?v=20261115c"></script>
<script src="js/common.js?v=20261115c"></script>
<script src="js/admin.js?v=20261115c"></script>
</body>
</html>
