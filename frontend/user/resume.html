<script>
        document.documentElement.classList.add('js');
        try { if (localStorage.getItem('resume_furigana') === 'off') document.documentElement.classList.add('furigana-off'); } catch (e) {}
    </script>

<body>
<script src="js/loading.js?v=20261117a"></script>
<canvas aria-hidden="true" id="bg3d"></canvas>
<header class="site-header">
<div class="header-inner">
<a aria-label="R-ESUME トップへ" class="brand" data-aria-en="Go to the top of R-ESUME" href="index.html"><span class="brand-mark"><img alt="" height="28" src="img/logo.png" width="24"/></span><span class="brand-name">R-ESUME</span></a>
<div class="header-tools" data-skip="">
<button aria-pressed="true" class="furi-btn" id="furiBtn" type="button"><span>ふりがな ON</span></button>
</div>
</div>
</header>
<main class="auth-main rs-main">
<div class="auth-card rs-card">
<div class="auth-badge" aria-hidden="true"><img src="img/logo.png" alt="" width="28" height="33"></div>
<p class="form-msg" id="rsMsg" role="status" aria-live="polite"></p>
<div id="viewList" hidden></div>
<div id="viewEdit" hidden></div>
</div>
</main>

<dialog id="dlgOpen" class="confirm">
    <h2><span data-l="ja" lang="ja">どうしますか？</span><span data-l="en" lang="en">What would you like to do?</span></h2>
    <p><span data-l="ja" lang="ja"><ruby>会話<rt>かいわ</rt></ruby>の<ruby>続<rt>つづ</rt></ruby>きから<ruby>作<rt>つく</rt></ruby>るか、<ruby>入力画面<rt>にゅうりょくがめん</rt></ruby>で<ruby>内容<rt>ないよう</rt></ruby>を<ruby>直<rt>なお</rt></ruby>すかを<ruby>選<rt>えら</rt></ruby>べます。</span><span data-l="en" lang="en">Continue the chat, or check and edit your answers on the form.</span></p>
    <div class="confirm-actions" style="flex-direction:column;align-items:stretch">
        <button type="button" class="btn" id="openChat"><span data-l="ja" lang="ja"><ruby>会話<rt>かいわ</rt></ruby>の<ruby>続<rt>つづ</rt></ruby>きから<ruby>作<rt>つく</rt></ruby>る</span><span data-l="en" lang="en">Continue the chat</span></button>
        <button type="button" class="btn btn-secondary" id="openForm"><span data-l="ja" lang="ja"><ruby>入力画面<rt>にゅうりょくがめん</rt></ruby>で<ruby>確認<rt>かくにん</rt></ruby>・<ruby>修正<rt>しゅうせい</rt></ruby>する</span><span data-l="en" lang="en">Check and edit on the form</span></button>
        <button type="button" class="btn btn-secondary" id="openNo"><span data-l="ja" lang="ja"><ruby>戻<rt>もど</rt></ruby>る</span><span data-l="en" lang="en">Back</span></button>
    </div>
</dialog>

<dialog id="dlgDel" class="confirm">
    <form method="dialog" id="delForm">
        <h2><span data-l="ja" lang="ja"><ruby>削除<rt>さくじょ</rt></ruby>しますか？</span><span data-l="en" lang="en">Delete this resume?</span></h2>
        <p><strong id="delName"></strong></p>
        <p><span data-l="ja" lang="ja"><ruby>削除<rt>さくじょ</rt></ruby>すると、<ruby>元<rt>もと</rt></ruby>に<ruby>戻<rt>もど</rt></ruby>せません。</span><span data-l="en" lang="en">This cannot be undone.</span></p>
        <div class="confirm-actions">
            <button type="button" class="btn btn-secondary" id="delNo"><span data-l="ja" lang="ja"><ruby>戻<rt>もど</rt></ruby>る</span><span data-l="en" lang="en">Back</span></button>
            <button type="submit" class="btn"><span data-l="ja" lang="ja"><ruby>削除<rt>さくじょ</rt></ruby>する</span><span data-l="en" lang="en">Delete</span></button>
        </div>
    </form>
</dialog>
